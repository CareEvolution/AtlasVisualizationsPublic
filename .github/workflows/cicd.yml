name: CICD

on: push

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build
