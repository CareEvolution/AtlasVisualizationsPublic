name: CICD

on: push

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build
